<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>차곡 AI</title><link rel="stylesheet" href="styles.css"></head><body><header><a class="brand" href="./"><span class="logo" aria-hidden="true">ㅋ</span><span>차곡 AI</span></a><nav><a href="./">자료 둘러보기</a><a href="about.html">이곳은?</a></nav></header><main><article class="detail" id="detail">자료를 펼치는 중...</article></main><footer><strong>차곡 AI</strong><span>개인정보 없이, 다시 쓸 수 있는 지식만 남깁니다.</span></footer><script>
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const id=new URLSearchParams(location.search).get('id');fetch('data/knowledge.json').then(r=>r.json()).then(items=>{const x=items.find(v=>v.id===id);if(!x)throw 0;document.title=x.title+' | 차곡 AI';const cautions=(x.cautions||[]).length?`<aside class="caution"><strong>살펴볼 점</strong><ul>${x.cautions.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></aside>`:'';const refs=[...new Set([x.url,...(x.sourceEvidence||[])].filter(Boolean))];document.querySelector('#detail').innerHTML=`<a class="back" href="./">← 모든 카드 보기</a><div class="meta"><span class="pill">${esc(x.type)}</span><span class="status">${esc(x.status)}</span></div><h1>${esc(x.title)}</h1><p class="lead">${esc(x.summary)}</p><div class="tags">${(x.tags||[]).map(t=>`<span>#${esc(t)}</span>`).join('')}</div><hr><h2>무엇을 할 수 있나요?</h2>${(x.content||[]).map(p=>`<p>${esc(p)}</p>`).join('')}${cautions}<h2>공식 자료</h2><div class="sources">${refs.map((u,i)=>`<a class="source" href="${esc(u)}" target="_blank" rel="noreferrer">${i?'관련 자료':'공식 페이지'} 열기 ↗</a>`).join('')}</div>`}).catch(()=>document.querySelector('#detail').innerHTML='<a class="back" href="./">← 돌아가기</a><h1>자료를 찾지 못했어요</h1>');
</script></body></html>
