<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Knowledge</title><link rel="stylesheet" href="styles.css"></head><body><header><a class="brand" href="./"><span class="logo">K</span><span>AI Knowledge</span></a></header><main><article class="detail" id="detail">불러오는 중...</article></main><script>
const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const id=new URLSearchParams(location.search).get('id');fetch('data/knowledge.json').then(r=>r.json()).then(items=>{const x=items.find(v=>v.id===id);if(!x)throw 0;document.title=x.title+' | AI Knowledge';document.querySelector('#detail').innerHTML=`<a class="back" href="./">← 전체 지식</a><div class="meta"><span class="pill">${esc(x.type)}</span><span class="status">${esc(x.status)}</span></div><h1>${esc(x.title)}</h1><p class="lead">${esc(x.summary)}</p><div class="tags">${x.tags.map(t=>`<span>#${esc(t)}</span>`).join('')}</div><hr>${x.content.map((p,i)=>`${i?'<h2>활용과 참고</h2>':''}<p>${esc(p)}</p>`).join('')}<a class="source" href="${encodeURI(x.url)}" target="_blank" rel="noreferrer">공식 자료 열기 ↗</a>`}).catch(()=>document.querySelector('#detail').textContent='자료를 찾을 수 없습니다.');
</script></body></html>
